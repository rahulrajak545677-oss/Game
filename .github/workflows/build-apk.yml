name: Build APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          mkdir -p "$RUNNER_TEMP/unzipped"
          unzip -q ./*.zip -d "$RUNNER_TEMP/unzipped"
          SETTINGS=$(find "$RUNNER_TEMP/unzipped" -name settings.gradle | head -n 1)
          test -n "$SETTINGS" || { echo "No Android project found inside the zip"; exit 1; }
          echo "PROJ=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: cd "$PROJ" && gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseRush-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk

      - name: Set up signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: env.KEYSTORE_BASE64 != ''
        run: cd "$PROJ" && gradle --no-daemon assembleRelease bundleRelease

      - name: Upload signed release
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: PulseRush-release
          path: |
            ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
            ${{ env.PROJ }}/app/build/outputs/bundle/release/*.aab
